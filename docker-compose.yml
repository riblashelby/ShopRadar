version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cheapcart-backend
    restart: unless-stopped
    volumes:
      - cheapcart_data:/app/data
    environment:
      - APP_NAME=CheapCart
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/cheapcart.db
      - HOST=0.0.0.0
      - PORT=8000
      - CACHE_TTL_HOURS=6
      - REQUEST_DELAY_MS=500
      - MAX_RETRIES=3
      - REQUEST_TIMEOUT_SEC=30
    ports:
      - "8000:8000"
    networks:
      - cheapcart_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cheapcart-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cheapcart_network

networks:
  cheapcart_network:
    driver: bridge

volumes:
  cheapcart_data:
    driver: local
